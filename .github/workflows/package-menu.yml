name: Build Windows menu-only preview
on:
  push:
    branches: [main]
    paths: ['launcher.py', 'library.py', 'assets/**', 'drive-index.json', 'NOTICE.md', '.github/workflows/package-menu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pygame==2.6.1 pyinstaller==6.11.1
      - name: Build menu-only portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory . --windowed --name AKG-Retro-Games-Menu-Preview --icon assets/platform-icons/retro-collection.ico --add-data 'assets;assets' --add-data 'drive-index.json;.' --add-data 'NOTICE.md;.' launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test packaged menu
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER='dummy'; $env:SDL_AUDIODRIVER='dummy'
          $p=Start-Process -Wait -PassThru -FilePath 'dist/AKG-Retro-Games-Menu-Preview/AKG-Retro-Games-Menu-Preview.exe' -ArgumentList '--smoke'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Zip preview and checksum
        shell: pwsh
        run: |
          'MENU PREVIEW ONLY: Does not run games. Experimental unsigned test build.' | Out-File -Encoding utf8 dist/AKG-Retro-Games-Menu-Preview/READ-ME.txt
          Compress-Archive -Path dist/AKG-Retro-Games-Menu-Preview -DestinationPath AKG-Retro-Games-Windows-menu-preview.zip
          (Get-FileHash -Algorithm SHA256 AKG-Retro-Games-Windows-menu-preview.zip).Hash | Out-File -Encoding ascii SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AKG-Retro-Games-Windows-menu-only-preview
          path: |
            AKG-Retro-Games-Windows-menu-preview.zip
            SHA256.txt
          retention-days: 14
          if-no-files-found: error
