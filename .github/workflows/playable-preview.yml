name: Build Windows playable preview
on:
  push:
    branches: [main]
    paths: ['launcher.py', 'launch_game.py', 'libretro_host.py', 'game_session.py', 'scripts/**', '.github/workflows/playable-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: midoali250/bitvault-engine
          ref: bc94ec6f684987a50808cd75a9a74cf77b948c95
          path: engine-source
          sparse-checkout: engine/desktop
      - name: Use pinned shared BitVault frontend
        shell: bash
        run: |
          cp engine-source/engine/desktop/{launcher.py,library.py,game_session.py,launch_game.py,libretro_host.py,preferences.py,github_update.py,signed_updates.py} .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
      - name: Verify pinned BitVault Engine registry
        run: python scripts/verify_engine.py
      - name: Build native libretro cores
        shell: msys2 {0}
        run: bash scripts/build_cores.sh win
      - name: Download and verify user games
        run: python scripts/package_roms.py
      - name: Install dependencies
        run: python -m pip install pygame==2.6.1 pyinstaller==6.11.1 setuptools==70.3.0 pillow==11.1.0 cryptography==44.0.3
      - name: Generate authentic in-game thumbnails and clean icon
        shell: bash
        run: |
          python engine-source/engine/desktop/thumbnail_builder.py cheats/index.json package-roms package-cores thumbnails
          python engine-source/engine/desktop/normalize_icon.py assets/app-icon.png assets/platform-icons/retro-collection.ico
      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AKG-Retro-Games --icon assets/platform-icons/retro-collection.ico --add-data 'updates/public-key.json;updates' --add-data 'assets;assets' --add-data 'drive-index.json;.' --add-data 'NOTICE.md;.' --add-data 'cheats;cheats' --add-data 'package-cores;cores' --add-data 'package-roms;roms' --add-data 'thumbnails;thumbnails' --add-data 'third-party-notices;third-party-notices' launcher.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Smoke test packaged sessions
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER='dummy'; $env:SDL_AUDIODRIVER='dummy'
          $env:USERPROFILE=Join-Path $env:RUNNER_TEMP 'akg-test-home'; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          foreach ($argsLine in @('--smoke --verify-update-key','--smoke --verify-update-key --ci-game-id 1TuDbnOzqjx3Z0WKKuc3zkRrLAR7F_pwf','--smoke --verify-update-key --ci-game-id 1RW03OkSJ_ZC4fCc2fT84rtUGwqmng0dT')) {
            $proc=Start-Process -Wait -PassThru -FilePath 'dist/AKG-Retro-Games.exe' -ArgumentList $argsLine
            if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          }
      - name: Prepare standalone executable and checksum
        shell: pwsh
        run: |
          Copy-Item dist/AKG-Retro-Games.exe AKG-Retro-Games-Windows-x64-preview.exe
          (Get-FileHash -Algorithm SHA256 AKG-Retro-Games-Windows-x64-preview.exe).Hash | Out-File -Encoding ascii SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AKG-Retro-Games-Windows-playable-preview
          path: |
            AKG-Retro-Games-Windows-x64-preview.exe
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
